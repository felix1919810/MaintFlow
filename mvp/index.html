<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MaintFlow · 点检交接 MVP</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#1d2f39;background:#f3f5f5}*{box-sizing:border-box}body{margin:0}header{background:#123d44;color:white;padding:28px max(24px,calc((100vw - 1200px)/2));display:flex;justify-content:space-between;gap:20px}header h1{margin:0;font-size:26px}header p{color:#c4dcdf;margin:8px 0}main{max-width:1200px;margin:24px auto;padding:0 20px}.notice{border-left:4px solid #bf8a39;padding:12px 16px;background:#fff8e7;font-size:14px}.grid{display:grid;grid-template-columns:340px 1fr;gap:20px;margin-top:20px}section{background:white;border:1px solid #dce3e4;border-radius:10px;padding:20px}h2{font-size:18px;margin:0 0 16px}h3{font-size:16px}label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}input,select,textarea{width:100%;padding:10px;border:1px solid #b7c8cb;border-radius:5px;font:inherit;font-size:14px}textarea{min-height:70px}input[type=checkbox]{width:auto}button{background:#16636b;border:0;color:white;border-radius:5px;padding:10px 14px;cursor:pointer;font:inherit;font-size:14px}button.secondary{background:#e6eef0;color:#1d434a}button:disabled{opacity:.5;cursor:default}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.counts{display:flex;gap:12px;margin:20px 0;flex-wrap:wrap}.count{background:#e8eff0;padding:12px 18px;border-radius:7px;font-size:14px}.count b{font-size:20px;margin-right:8px}.task{display:block;width:100%;text-align:left;background:white;color:#183d45;border:1px solid #d1e0e2;margin:8px 0}.task.active{border:2px solid #16636b;background:#edf6f5}.task small{display:block;color:#58747c;margin-top:5px}.badge{background:#e1eeef;padding:3px 8px;border-radius:4px;font-size:12px}.muted{font-size:13px;color:#5b717b}.source{padding:12px;background:#f1f5f6;border-left:3px solid #37858c;white-space:pre-wrap;overflow-wrap:anywhere}#message{position:sticky;top:0;padding:12px;background:#fff3da;border:1px solid #dfbd78;display:none;z-index:2}ol{padding-left:23px}li{margin:10px 0;font-size:13px;overflow-wrap:anywhere}.split{display:grid;grid-template-columns:220px 1fr;gap:18px}details{margin:14px 0}footer{margin:24px 0;color:#5b717b;font-size:12px}@media(max-width:850px){.grid,.split{grid-template-columns:1fr}header{display:block}.row>*{min-width:110px}}
</style>
<header><div><h1>MaintFlow · 维序</h1><p>点检记录 → 来源核对 → 具名交接 → 人工闭环</p></div><div><span class="badge" style="color:#173b43">MVP 0.2 · 离线演示</span><p>海岳机电 / 设备协同</p></div></header>
<main><div id="message" role="status"></div><p class="notice">仅使用合成样本。演示身份切换不代表真实鉴权；数据保存在当前浏览器。系统不控制设备、不执行维修、不批准复产，也不调用云端 API。</p>
<div class="row"><div><label for="actor">当前演示操作者</label><select id="actor"></select></div><div><label for="filter">任务筛选</label><select id="filter"><option value="">全部状态</option></select></div><div><label>演示工具</label><button id="export" class="secondary">导出记录 JSON</button> <button id="reset" class="secondary">重置合成数据</button></div></div>
<div class="counts" id="counts"></div><div class="grid"><section><h2>新建点检</h2><form id="create"><label for="id">唯一业务编号</label><input id="id" maxlength="60" required placeholder="CHK-001"><label for="device">范围内设备</label><select id="device"><option>M-01</option><option>M-02</option></select><label for="symptom">现场描述</label><textarea id="symptom" maxlength="500" required placeholder="例如：运转杂音"></textarea><label for="source">核对依据</label><select id="source"></select><label><input type="checkbox" id="drift"> 存在传感器漂移疑点</label><p class="muted">原始描述与统一术语同时保留。缺依据、错设备、版本冲突、超过15分钟或漂移疑点均转人工核对。</p><button type="submit">保存点检草稿</button></form><details><summary>合成来源</summary><div id="sources" class="muted"></div></details></section>
<section><h2>任务与交接</h2><div class="split"><div id="list"></div><div id="detail"><p class="muted">先创建点检记录，或选择已有任务。</p></div></div></section></div><footer>关闭或刷新页面后记录仍在本浏览器中。清除浏览器数据会丢失记录，请及时导出。无真实设备接口和用户账号。</footer></main>
<script type="module">
import {USERS,STATES,fixtures,createTask,transition,validateState} from './core.mjs';
const $=id=>document.getElementById(id),key='maintflow-mvp-v02';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state,selected=null,storageError='';
try{const raw=localStorage.getItem(key);state=raw?validateState(JSON.parse(raw)):{schema:1,tasks:[],sources:fixtures()};}catch(e){storageError=e.message;state={schema:1,tasks:[],sources:fixtures()};}
$('actor').innerHTML=Object.entries(USERS).map(([id,n])=>`<option value="${id}">${esc(n)}</option>`).join('');
$('filter').innerHTML+=STATES.map(s=>`<option>${s}</option>`).join('');
function message(s){$('message').textContent=s;$('message').style.display='block';}
function save(next){if(storageError)throw Error('本地存储不可用，请先处理错误或重置演示数据');try{localStorage.setItem(key,JSON.stringify(next));}catch{throw Error('浏览器存储失败，记录未保存；请导出后检查配额');}state=next;}
function render(){
 $('counts').innerHTML=STATES.map(s=>`<div class="count"><b>${state.tasks.filter(t=>t.status===s).length}</b>${s}</div>`).join('');
 $('source').innerHTML='<option value="">未提供来源</option>'+state.sources.map(s=>`<option value="${esc(s.id)}">${esc(s.id)}</option>`).join('');
 $('sources').innerHTML=state.sources.map(s=>`<p><b>${esc(s.id)}</b><br>${esc(s.at)}<br>${esc(s.excerpt)}</p>`).join('');
 const tasks=state.tasks.filter(t=>!$('filter').value||t.status===$('filter').value);
 $('list').innerHTML=tasks.length?tasks.map(t=>`<button class="task ${selected===t.id?'active':''}" data-id="${esc(t.id)}">${esc(t.id)} <span class="badge">${esc(t.status)}</span><small>${esc(t.device)} · ${esc(t.symptom)}</small></button>`).join(''):'<p class="muted">暂无符合条件的任务</p>';
 document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selected=b.dataset.id;render();});
 const t=state.tasks.find(t=>t.id===selected);if(!t){$('detail').innerHTML='<p class="muted">创建或选择一个任务以查看详情。</p>';return;}
 const actor=$('actor').value;
 $('detail').innerHTML=`<h3>${esc(t.id)} <span class="badge">${esc(t.status)}</span></h3><p>设备：${esc(t.device)}<br>原始描述：${esc(t.originalSymptom)}<br>统一术语：${esc(t.symptom)}<br>创建者：${esc(USERS[t.author])}</p><div class="source">${t.source?`${esc(t.source.id)} / ${esc(t.source.version)}<br>${esc(t.source.at)}<br>${esc(t.source.excerpt)}`:'没有来源，必须人工补证'}</div>${t.reviewReasons.length?`<p class="notice">${esc(t.reviewReasons.join('；'))}</p>`:''}${t.reviewNote?`<p>人工核对：${esc(t.reviewNote)}</p>`:''}${t.recipient?`<p>指定接手人：${esc(USERS[t.recipient])}<br>交接说明：${esc(t.handoffNote)}</p>`:''}<div id="actions"></div>${t.closure?`<h3>闭环记录</h3><p>修好：${esc(t.closure.repairedAt)}<br>稳定复产：${esc(t.closure.stableAt)}<br>现场确认人：${esc(t.closure.signer)}<br>${esc(t.closure.note)}</p>`:''}<details open><summary>审计轨迹（${t.audit.length}条）</summary><ol>${t.audit.map(a=>`<li>${esc(a.at)} · ${esc(USERS[a.actor])}<br><b>${esc(a.action)}</b>：${esc(a.detail)}</li>`).join('')}</ol></details>`;
 const a=$('actions');
 if(t.status==='待核对')a.innerHTML='<h3>人工核对</h3><label>有效来源</label><select id="reviewSource">'+state.sources.map(s=>`<option value="${esc(s.id)}">${esc(s.id)}</option>`).join('')+'</select><label>现场核实与补证说明</label><textarea id="reviewNote"></textarea><button data-action="review">确认核对结果</button><p class="muted">由计划员、安全负责人或经理演示复核；冲突/过期来源仍不能通过。</p>';
 if(t.status==='待交接')a.innerHTML='<h3>发起具名交接</h3><label>接手人</label><select id="recipient">'+Object.entries(USERS).filter(([id])=>id!==actor).map(([id,n])=>`<option value="${id}">${esc(n)}</option>`).join('')+'</select><label>交接说明与未解项（没有未解项也需注明）</label><textarea id="handoffNote"></textarea><button data-action="handoff">提交待接手</button>';
 if(t.status==='待接手')a.innerHTML='<p class="notice">发出交接不等于责任转移，切换为指定接手人后确认。</p><button data-action="accept">由我确认接手</button>';
 if(t.status==='处理中')a.innerHTML='<h3>登记人工处理结果</h3><label>设备修好时间</label><input type="datetime-local" id="repairedAt"><label>稳定复产时间</label><input type="datetime-local" id="stableAt"><label>现场授权确认人</label><input id="signer" maxlength="80"><label>处理依据及未解项结论</label><textarea id="closeNote"></textarea><label><input type="checkbox" id="safetyConfirmed"> 已由现场授权人员完成安全确认（仅登记）</label><button data-action="close">记录闭环结果</button>';
 if(t.status!=='已闭环')a.innerHTML+='<details><summary>退回人工核对</summary><textarea id="returnNote" placeholder="必须记录退回原因"></textarea><button data-action="return" class="secondary">退回并留痕</button></details>';
 document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(t,b.dataset.action));
}
function act(t,action){try{const v=id=>$(id)?.value||'';const p=action==='review'?{sourceId:v('reviewSource'),note:v('reviewNote')}:action==='handoff'?{recipient:v('recipient'),note:v('handoffNote')}:action==='return'?{note:v('returnNote')}:action==='close'?{repairedAt:v('repairedAt'),stableAt:v('stableAt'),signer:v('signer'),note:v('closeNote'),safetyConfirmed:$('safetyConfirmed').checked}:{};const changed=transition(t,action,$('actor').value,p,state.sources);save({...state,tasks:state.tasks.map(x=>x.id===t.id?changed:x)});render();message('已保存：'+changed.status);}catch(e){message(e.message);}}
$('create').onsubmit=e=>{e.preventDefault();try{const t=createTask({id:$('id').value,device:$('device').value,symptom:$('symptom').value,sourceId:$('source').value,drift:$('drift').checked,actor:$('actor').value},state.tasks,state.sources);save({...state,tasks:[...state.tasks,t]});selected=t.id;$('create').reset();render();message('已保存点检，状态：'+t.status);}catch(e){message(e.message);}};
$('actor').onchange=render;$('filter').onchange=render;
$('export').onclick=()=>{const b=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString(),notice:'合成演示；身份切换非鉴权'},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='maintflow-records.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
$('reset').onclick=()=>{if(!confirm('重置会清除本浏览器的MVP演示记录并刷新合成来源时间。请先导出需要保留的数据。'))return;try{const next={schema:1,tasks:[],sources:fixtures()};localStorage.setItem(key,JSON.stringify(next));state=next;storageError='';selected=null;render();message('合成演示数据已重置');}catch{message('无法访问本地存储');}};
render();if(storageError)message('本地数据读取失败：'+storageError+'。为避免覆盖，保存已禁用；可重置演示数据。');
</script></html>
